# ── DATABASE ──────────────────────────────────────────────────
# On your laptop these come from your local MySQL
# On Render these come from environment variables you set there
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/agrilink_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Sanju@1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA ────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ── SERVER ─────────────────────────────────────────────────────
# On Render, PORT is set automatically. On laptop it uses 8090.
server.port=${PORT:8090}

# ── JWT ────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:AgriLinkSuperSecretKey2024MustBe32CharsLong!}
jwt.expiration=86400000

# ── JACKSON ────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ── SWAGGER ────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html