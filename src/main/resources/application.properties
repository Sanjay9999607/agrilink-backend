spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/agrilink_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Sanju@1234}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.port=${PORT:8090}

jwt.secret=${JWT_SECRET:AgriLinkSuperSecretKey2024MustBe32CharsLong!}
jwt.expiration=86400000

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html